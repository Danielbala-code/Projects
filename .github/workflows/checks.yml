name: Demo checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        env:
          CC: gcc
          CXX: g++
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_CUDA=OFF'
        run: python -m pip install -r requirements.txt -r requirements-membership.txt
      - name: Verify core workflow without model weights
        run: python -m pytest -q
      - name: Check browser script syntax
        run: |
          node --check studio/static/app.js
          node --check membership/static/app.js
